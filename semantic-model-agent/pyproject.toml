[project]
name = "cube-model-builder"
version = "0.1.0"
description = "Generates Cube semantic-layer YAML (model/cubes/*.yml) from a folder of CSV/Parquet files, using the same deterministic-analysis + typed-plan + compile-validated-retry architecture as lexi's mcfly agent (which targets Malloy instead of Cube)."
requires-python = ">=3.11"
dependencies = [
    # Version floor matches lexi's mcfly agent's own pyproject.toml, which
    # this package's agents.py API usage (BedrockConverseModel, ModelRetry,
    # Agent.tool) was copied from verbatim.
    "pydantic-ai>=1.94.0",
    "pydantic-ai-slim[bedrock]",
    "duckdb>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
cube-model-builder = "cube_model_builder.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cube_model_builder"]
